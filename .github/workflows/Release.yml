name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Release Info
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          echo "Release $TAG_NAME published"
          echo "Distribution: GitHub Releases"
          echo "Download: https://github.com/Otaku-desu33333/Champagne/releases"
